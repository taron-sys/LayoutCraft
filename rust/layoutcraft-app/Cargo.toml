[package]
name = "layoutcraft-app"
version = "0.1.0-rc.5"
edition = "2021"
description = "Native LayoutCraft editor shell"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
layoutcraft-engine = { path = "../layoutcraft-engine" }
layoutcraft-model = { path = "../layoutcraft-model" }
layoutcraft-render = { path = "../layoutcraft-render" }
layoutcraft-vsdx = { path = "../layoutcraft-vsdx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.50"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(not(windows))'.dependencies]
rfd = "0.18" # MIT OR Apache-2.0: native open/save dialogs (portal on Linux)
