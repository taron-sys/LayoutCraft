[package]
name = "layoutcraft-vsdx"
version = "0.1.0"
edition = "2021"
description = "VSDX OPC package and page metadata reader"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
roxmltree = "0.21"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { version = "~9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
layoutcraft-model = { path = "../layoutcraft-model" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
