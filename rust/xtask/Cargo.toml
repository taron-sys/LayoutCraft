[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Repository tools run as `cargo xtask <command>`: provenance guard, third-party notices, local web server"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
