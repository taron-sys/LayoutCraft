# CI of the public repository: what a stranger's clone builds and tests (docs/36-packaging.md, docs/38-private-fixtures.md).
# Tests that need the private corpus are compiled out (cfg(private_fixtures)); the Visio-based checks are run by the maintainers elsewhere.
# Every action is pinned to a commit SHA (the tag is in the comment); keep them current with Dependabot (github-actions).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the older run of the same PR (runs on main always finish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LAYOUTCRAFT_PUBLIC_BUILD: '1' # exactly what the public repository builds (no private modules)
  # The Ubuntu runner ran out of disk while linking the test binaries (full debug info for the egui/wgpu tree in every one).
  # CI needs neither debug info for tests nor incremental build state; panics still say which test and file failed.
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, installs the current stable Rust
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-native-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-native-${{ runner.os }}-
      - name: System libraries of eframe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev
      - name: Tests
        run: cargo test --workspace --no-fail-fast
      - name: Public fixture conformance (self-authored set)
        run: cargo run --quiet -p layoutcraft-conformance -- --root .. --manifest ../fixtures/public/manifest.json
      - name: Release build (main only; the tests above already compile every crate)
        if: github.event_name == 'push'
        run: cargo build --release -p layoutcraft-app -p layoutcraft-mcp

  web:
    name: wasm and notices (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, installs the current stable Rust
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-web-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-web-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Provenance guard (public wording and private paths)
        working-directory: rust
        run: cargo xtask provenance
      - name: Build the wasm (public build)
        env:
          CARGO_TOOLCHAIN: '' # the script pins a toolchain for the maintainers' machine; on the runner the default one is used
        run: sh tools/build-web-wasm.sh public
      - name: Third-party notices are current
        working-directory: rust
        env:
          CARGO_TOOLCHAIN: '' # use the runner's default toolchain, as for the wasm build
        run: |
          cargo fetch
          cargo xtask notices --check

  deny:
    name: licences and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: rust/Cargo.toml
          command: check
          arguments: --all-features
